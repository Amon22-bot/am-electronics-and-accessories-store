services:
  # Frontend only. Deploy the am-electronics-api service first.
  - type: web
    name: am-electronics-frontend
    runtime: static
    rootDir: .
    buildCommand: node scripts/build-static.js
    staticPublishPath: ./dist
    envVars:
      - key: API_BASE_URL
        fromService:
          name: am-electronics-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
